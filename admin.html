<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Living India · Admin</title><link rel="stylesheet" href="./style.css"><style>
body{margin:0;background:#f4efe4;color:#19382d;font-family:Arial,sans-serif}.admin-wrap{max-width:1200px;margin:0 auto;padding:28px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.admin-brand{font-family:Georgia,serif;font-size:30px}.admin-brand b{color:#b65b3b}.admin-user{font-size:13px;color:#6d6257}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.admin-tabs button,.admin-btn{border:1px solid #cfc4b3;background:#fffaf1;border-radius:999px;padding:10px 16px;cursor:pointer;color:#19382d;font-weight:700}.admin-tabs button.active,.admin-btn.primary{background:#19382d;color:#fff}.admin-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}.admin-panel{background:#fffaf1;border:1px solid #d8cdbd;border-radius:20px;padding:22px;box-shadow:0 8px 30px #3d2b1712}.admin-panel h2{font-family:Georgia,serif;margin-top:0}.admin-form{display:grid;gap:11px}.admin-form label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.admin-form input,.admin-form textarea,.admin-form select{width:100%;box-sizing:border-box;border:1px solid #cfc4b3;border-radius:10px;padding:11px;background:#fff}.admin-form textarea{min-height:90px;resize:vertical}.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-list{display:grid;gap:10px;max-height:620px;overflow:auto}.admin-item{border:1px solid #ddd2c2;border-radius:14px;padding:14px;background:#fff}.admin-item strong{display:block}.admin-item small{color:#756b61}.admin-item-actions{display:flex;gap:7px;margin-top:10px}.admin-empty{color:#766b60;padding:25px;text-align:center}.admin-note{font-size:13px;line-height:1.5;color:#756b61;background:#f0e8da;padding:12px;border-radius:12px;margin-bottom:14px}.danger{color:#a43f2b}.status{margin-top:10px;font-size:13px;font-weight:700}.denied{max-width:650px;margin:15vh auto;background:#fffaf1;border-radius:22px;padding:40px;text-align:center}.back{color:#19382d;text-decoration:none;font-weight:700}.report{border:1px solid #ddd2c2;padding:14px;border-radius:14px;background:#fff;margin-bottom:10px}.report pre{white-space:pre-wrap;font:inherit}.jsonbox{font-family:monospace;min-height:180px} .hg-admin-list{display:grid;gap:14px;max-height:700px;overflow:auto}.hg-admin-card{display:grid;grid-template-columns:130px 1fr;gap:16px;border:1px solid #ddd2c2;border-radius:16px;padding:14px;background:#fff}.hg-admin-card>img{width:130px;height:130px;object-fit:cover;border-radius:12px;background:#eee}.hg-admin-info{min-width:0}.hg-admin-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hg-admin-top strong{font:500 23px Georgia,serif}.hg-admin-top span{font-size:10px;letter-spacing:.1em;font-weight:900;padding:6px 9px;border-radius:999px;background:#efe6d5}.status-approved .hg-admin-top span{background:#dcecdf;color:#24543a}.status-rejected .hg-admin-top span{background:#f2ddd7;color:#8d3b2b}.status-pending .hg-admin-top span{background:#f2e6c8;color:#8a6328}.hg-admin-info p{line-height:1.5;color:#665e55}.hg-admin-info small{color:#8a8177}.hg-admin-card.status-rejected{opacity:.78}@media(max-width:650px){.hg-admin-card{grid-template-columns:1fr}.hg-admin-card>img{width:100%;height:220px}}
@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}.admin-row{grid-template-columns:1fr}}
</style></head><body><div id="admin-root"></div><script type="module" src="./admin.jsx"></script></body></html>
